name: queue
# Change the release queue (tools/yt_move.py): move a PRIVATE video's release time, or take it out of the queue
# (stays private). Nothing is deleted, nothing public is touched. stats.json is committed after it.
on:
  workflow_dispatch:
    inputs:
      args:
        description: "Space-separated: ID=2026-11-24T00:00:00Z (release at UTC) | hold:ID (no release, stays private)"
        type: string
        required: true
permissions:
  contents: write
concurrency:
  group: long
  cancel-in-progress: false
jobs:
  queue:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: python -u tools/yt_move.py $ARGS
        env:
          ARGS: ${{ inputs.args }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      - name: commit stats
        env:
          ARGS: ${{ inputs.args }}
        run: |
          git config user.name "ww2-long bot"
          git config user.email "actions@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet || (git commit -m "queue: $ARGS" && git pull --rebase && git push)
